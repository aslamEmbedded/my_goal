<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sk Aslam Ali</title>
<meta name="description" content="This site is owned by Sk Aslam Ali">
<style>
  :root{--bg:#060813;--ice:#8fe9ff;--rose:#ff5fa8;--text:#f3f6ff}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--text)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .glow{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(60% 50% at 50% 50%,rgba(143,233,255,.10),transparent 70%),
               radial-gradient(40% 40% at 70% 65%,rgba(255,95,168,.10),transparent 70%)}
  main{position:fixed;inset:0;display:grid;place-items:center;perspective:900px;pointer-events:none;padding:24px}
  .card{text-align:center;transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform}
  .small{font-weight:400;font-size:clamp(.7rem,1.6vw,.85rem);letter-spacing:.06em;color:rgba(243,246,255,.6);
    opacity:0;transform:translateZ(40px);animation:in 1.4s .3s forwards}
  h1{font-weight:500;font-size:clamp(1.3rem,3.6vw,2rem);line-height:1.2;margin-top:.5em;letter-spacing:.04em;
    transform:translateZ(90px);color:var(--text);
    opacity:0;animation:in 1.6s .6s forwards}
  @keyframes in{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}
  @media (prefers-reduced-motion:reduce){h1,.small{animation:in .01s forwards}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="glow"></div>
<main>
  <div class="card" id="card">
    <p class="small">this site is owned by</p>
    <h1>Sk Aslam Ali</h1>
  </div>
</main>

<script>
(function(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d'),card=document.getElementById('card');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W,H,dpr,N,pts=[];
  let mx=0,my=0,tx=0,ty=0;

  function build(){
    N=Math.min(1400,Math.floor(innerWidth*innerHeight/900));
    pts=[];
    const ga=Math.PI*(3-Math.sqrt(5));
    for(let i=0;i<N;i++){
      const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),a=ga*i;
      pts.push({x:Math.cos(a)*r,y:y,z:Math.sin(a)*r,k:0});
    }
    for(let k=1;k<=2;k++){
      for(let i=0;i<220;i++){
        const a=i/220*Math.PI*2,R=1.55;
        const p={x:Math.cos(a)*R,y:0,z:Math.sin(a)*R,k:k};
        const t=k===1?0.5:-0.9, c=Math.cos(t), s=Math.sin(t);
        const y2=p.y*c-p.z*s, z2=p.z*c+p.y*s; p.y=y2;p.z=z2;
        pts.push(p);
      }
    }
  }
  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;
    build();
  }
  addEventListener('resize',resize);resize();

  function move(x,y){
    mx=(x/innerWidth-.5)*2; my=(y/innerHeight-.5)*2;
  }
  addEventListener('pointermove',e=>move(e.clientX,e.clientY));
  addEventListener('deviceorientation',e=>{
    if(e.gamma==null)return; mx=Math.max(-1,Math.min(1,e.gamma/30)); my=Math.max(-1,Math.min(1,(e.beta-45)/30));
  });

  let t=0;
  function frame(){
    if(!reduce)t+=0.004;
    tx+=(mx-tx)*.05; ty+=(my-ty)*.05;
    ctx.clearRect(0,0,W,H);
    const size=Math.min(W,H)*0.34, cx=W/2, cy=H/2, f=3.2;
    const ay=t+tx*0.9, ax=ty*0.6+Math.sin(t*.7)*.15;
    const cyA=Math.cos(ay),syA=Math.sin(ay),cxA=Math.cos(ax),sxA=Math.sin(ax);
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<pts.length;i++){
      const p=pts[i];
      let r=1; if(p.k===0) r=1+0.06*Math.sin(p.y*6+t*5);
      let x=p.x*r,y=p.y*r,z=p.z*r;
      let x1=x*cyA+z*syA, z1=z*cyA-x*syA;
      let y1=y*cxA-z1*sxA, z2=z1*cxA+y*sxA;
      const s=f/(f+z2+0.6);
      const px=cx+x1*size*s, py=cy+y1*size*s;
      const d=(z2+1.8)/3.6;
      const a=Math.max(.08,Math.min(1,d*d*1.2));
      const rad=(p.k===0?1.4:1.8)*s*dpr;
      ctx.fillStyle=p.k===0
        ? 'rgba('+(143+d*70|0)+','+(233-d*80|0)+',255,'+a+')'
        : 'rgba(255,'+(95+d*60|0)+',168,'+a+')';
      ctx.beginPath();ctx.arc(px,py,rad,0,6.283);ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    card.style.transform='rotateY('+(tx*10).toFixed(2)+'deg) rotateX('+(-ty*8).toFixed(2)+'deg)';
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
